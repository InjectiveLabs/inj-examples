[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
# Required: the BankERC20 backed OFT constructor forwards five arguments to two
# base constructors and overflows the legacy stack allocator without IR codegen.
via_ir = true

# solidity-contracts carries LayerZero and OpenZeppelin as its own submodules,
# so one install brings every dependency the example needs.
remappings = [
  '@injectivelabs/solidity-contracts/=lib/solidity-contracts/',
  '@layerzerolabs/oft-evm/=lib/solidity-contracts/lib/devtools/packages/oft-evm/',
  '@layerzerolabs/oapp-evm/=lib/solidity-contracts/lib/devtools/packages/oapp-evm/',
  '@layerzerolabs/lz-evm-protocol-v2/=lib/solidity-contracts/lib/layerzero-v2/packages/layerzero-v2/evm/protocol',
  '@openzeppelin/contracts/=lib/solidity-contracts/lib/openzeppelin-contracts/contracts/',
  'forge-std/=lib/forge-std/src/',
]

[rpc_endpoints]
injective-testnet = "${RPC_URL}"
injective-mainnet = "https://sentry.evm-rpc.injective.network/"
